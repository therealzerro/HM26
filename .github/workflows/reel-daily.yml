# OPS-09 — the daily reel run on a GitHub runner, started by the operator's
# button in Admin → Reels (edge function `reel-run` → workflow_dispatch).
#
# OPERATOR-TRIGGERED ONLY. There is no `schedule:` block and there must never
# be one (OPS-01: nothing in this system runs on a timer).
#
# It runs the same chain as `npm run reel:daily` on the codespace: preflight
# (OPS-07) → scripts/run-daily-reels.sh in its foreground mode. Each kind
# publishes to Supabase as it completes, so a failure mid-list loses nothing
# already registered — press the button again with "from" set to the kind that
# failed.
name: reel-daily

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Start at this kind (verify = full run)'
        type: choice
        default: verify
        options: [verify, allday, midday, evening, record]

# One run at a time. A second press while one is running is refused by the
# edge function; this is the backstop if a run is dispatched from GitHub's UI.
concurrency:
  group: reel-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reels:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      # Must match the version the codespace renders with (not in package.json).
      PLAYWRIGHT_VERSION: '1.60.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun add --no-save "playwright@${PLAYWRIGHT_VERSION}"

      - name: Install ffmpeg + Chromium (with system fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npx playwright install --with-deps chromium
          ffmpeg -version | head -1

      - name: Write env files
        env:
          SUPABASE_URL: ${{ secrets.REEL_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.REEL_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.REEL_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for V in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!V}" ] || { echo "ABORT: repo secret REEL_$V is not set (run scripts/setup-reel-button.sh)."; exit 1; }
          done
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "EXPO_PUBLIC_BACKEND=enabled"
            echo "EXPO_PUBLIC_USE_EDGE_ZK6=true"
            echo "EXPO_PUBLIC_USE_EDGE_ZK30=true"
          } > .env
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
          } > .env.backtest

      - name: Preflight (OPS-07 data gate)
        run: npx tsx scripts/reel-preflight.ts

      - name: Start dev server and warm the bundle
        run: |
          nohup npx expo start --port 8081 > "$RUNNER_TEMP/devserver.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null --max-time 5 http://localhost:8081/ && break
            sleep 5
          done
          curl -sf -o /dev/null --max-time 5 http://localhost:8081/ \
            || { echo "ABORT: dev server never answered on :8081"; tail -50 "$RUNNER_TEMP/devserver.log"; exit 1; }
          # A cold bundle takes longer than the renderer's page timeout — build it first.
          SRC=$(curl -s --max-time 120 'http://localhost:8081/track-record?capture=1' \
            | grep -oE 'src="[^"]*entry\.bundle[^"]*"' | head -1 | sed 's/src="//;s/"$//;s/&amp;/\&/g')
          [ -n "$SRC" ] || { echo "ABORT: no entry.bundle in the page"; exit 1; }
          curl -s -o /dev/null --max-time 600 -w 'bundle %{http_code} %{size_download}B %{time_total}s\n' "http://localhost:8081$SRC"

      - name: Render, assemble and publish
        env:
          HM26_REELS_DETACHED: '1'   # foreground mode: the script's own loop, no setsid
        run: bash scripts/run-daily-reels.sh "--from=${{ inputs.from }}"

      - name: Probe finals
        run: |
          STATUS=0
          for F in $(git status --porcelain assets/marketing/*_reels | awk '{print $2}' | grep -E '_reels/[a-z_]+_[0-9]{8}\.mp4$' | grep -vE '/(ui_|_)' ); do
            D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F" 2>&1) || { echo "BAD  $F  $D"; STATUS=1; continue; }
            echo "ok   $F  ${D}s"
          done
          exit $STATUS

      - name: Commit reel folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/marketing/verify_reels assets/marketing/allday_reels assets/marketing/midday_reels assets/marketing/evening_reels assets/marketing/record_reels
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          D=$(TZ=America/New_York date +%-m/%-d)
          git commit -q -m "reels $D: button run (from=${{ inputs.from }}, run #${{ github.run_number }})"
          git pull -q --rebase origin "${{ github.ref_name }}"
          git push -q origin "HEAD:${{ github.ref_name }}"

      - name: Dev server log (on failure)
        if: failure()
        run: tail -80 "$RUNNER_TEMP/devserver.log" || true
