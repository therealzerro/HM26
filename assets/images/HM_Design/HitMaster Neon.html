<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>HitMaster — Neon</title>
<meta name="viewport" content="width=1600"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#0a0613; }
  body { font-family:'Inter', system-ui, sans-serif; }
  @keyframes pulseDot { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  @keyframes ringRot  { to { transform: rotate(360deg); } }
  .glow-cyan  { box-shadow: 0 0 0 1.5px #2bffcc, 0 0 22px rgba(43,255,204,.45), inset 0 0 18px rgba(43,255,204,.08); }
  .glow-rose  { box-shadow: 0 0 0 1.5px #ff3d9a, 0 0 22px rgba(255,61,154,.45), inset 0 0 18px rgba(255,61,154,.08); }
  .glow-amber { box-shadow: 0 0 0 1.5px #ff6a2b, 0 0 22px rgba(255,106,43,.55), inset 0 0 18px rgba(255,106,43,.10); }
  .glow-purple{ box-shadow: 0 0 0 1.5px #9b5bff, 0 0 22px rgba(155,91,255,.45), inset 0 0 18px rgba(155,91,255,.08); }
  .glow-gold  { box-shadow: 0 0 0 1.5px #ffd93d, 0 0 22px rgba(255,217,61,.45), inset 0 0 18px rgba(255,217,61,.06); }
  .gtext-cyan { color:#2bffcc; text-shadow:0 0 8px rgba(43,255,204,.6); }
  .gtext-rose { color:#ff3d9a; text-shadow:0 0 8px rgba(255,61,154,.6); }
  .gtext-amber{ color:#ff6a2b; text-shadow:0 0 10px rgba(255,106,43,.7); }
  .gtext-gold { color:#ffd93d; text-shadow:0 0 8px rgba(255,217,61,.55); }
  .gtext-purple{color:#b388ff; text-shadow:0 0 8px rgba(155,91,255,.6); }
  .scrollhide::-webkit-scrollbar { display:none; }
  .scrollhide { scrollbar-width:none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ── palette ───────────────────────────────────────────────────────────
const C = {
  bg0: '#0a0613',         // page
  bg1: '#120a1f',         // surface
  card:'rgba(20,12,38,0.72)',
  borderSoft:'rgba(255,255,255,0.08)',
  text:'#FFFFFF',
  textSec:'rgba(255,255,255,0.72)',
  textTer:'rgba(255,255,255,0.45)',
  cyan:'#2bffcc', cyan2:'#15d9a8',
  rose:'#ff3d9a', rose2:'#e91e63',
  amber:'#ff6a2b', amber2:'#ff3b30',
  gold:'#ffd93d',
  purple:'#9b5bff', purple2:'#b388ff',
  blue:'#22a3ff',
};

// ── primitives ────────────────────────────────────────────────────────
function Pill({ children, color=C.purple, active=false, icon, style }) {
  return (
    <div style={{
      display:'inline-flex', alignItems:'center', gap:6,
      padding:'7px 12px', borderRadius:999,
      background: active ? `linear-gradient(180deg, ${color}33, ${color}11)` : 'rgba(255,255,255,0.04)',
      border: `1.2px solid ${active ? color : 'rgba(255,255,255,0.10)'}`,
      boxShadow: active ? `0 0 14px ${color}66` : 'none',
      color: active ? '#fff' : C.textSec,
      fontFamily:'Inter', fontSize:13, fontWeight:600, letterSpacing:'0.01em',
      ...style,
    }}>
      {icon}
      {children}
    </div>
  );
}

function StatTile({ value, label, color=C.purple }) {
  return (
    <div style={{
      flex:1, display:'flex', flexDirection:'column', alignItems:'center',
      padding:'10px 6px', borderRadius:10,
      background:'rgba(255,255,255,0.03)',
      border:`1px solid ${color}55`,
      boxShadow:`0 0 14px ${color}33, inset 0 0 10px ${color}10`,
    }}>
      <div style={{ fontFamily:'Inter', fontSize:22, fontWeight:800, color:'#fff', lineHeight:1 }}>{value}</div>
      <div style={{ fontFamily:'Inter', fontSize:10, fontWeight:600, color: color, marginTop:5, letterSpacing:'0.06em' }}>{label}</div>
    </div>
  );
}

// glowing avatar bubble (letters like TN / TX)
function AvatarBubble({ letters, color=C.cyan, size=58 }) {
  return (
    <div style={{
      width:size, height:size, borderRadius:'50%',
      display:'flex', alignItems:'center', justifyContent:'center',
      background:`radial-gradient(circle at 30% 30%, ${color}33, ${color}08 70%, transparent)`,
      border:`2px solid ${color}`,
      boxShadow:`0 0 16px ${color}99, inset 0 0 12px ${color}55`,
      fontFamily:'Inter', fontSize:size*0.36, fontWeight:800, color:'#fff',
      letterSpacing:'0.04em',
      textShadow:`0 0 8px ${color}aa`,
    }}>{letters}</div>
  );
}

// big slate row card
function SlateRow({ avatar, avatarColor, label, mode, hit, combo, f, b, s }) {
  const ring = avatarColor;
  return (
    <div style={{
      position:'relative', borderRadius:16, padding:'14px 14px',
      background:'linear-gradient(180deg, rgba(20,12,38,0.65), rgba(10,6,19,0.85))',
      backdropFilter:'blur(8px)',
      display:'flex', alignItems:'center', gap:14,
    }} className={`glow-${ring===C.cyan?'cyan':ring===C.rose?'rose':ring===C.amber?'amber':'purple'}`}>
      <AvatarBubble letters={avatar} color={ring} size={56}/>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ fontFamily:'Inter', fontSize:16, fontWeight:700, color:'#fff' }}>{label}</div>
        <div style={{ fontFamily:'Inter', fontSize:12, color:C.textSec, marginTop:2 }}>
          <span style={{ color: ring }}>◐</span> {mode}
        </div>
        {hit && (
          <div style={{ marginTop:6, display:'inline-block',
            padding:'3px 8px', borderRadius:5,
            border:`1px solid ${ring}`, color:ring,
            fontFamily:'Inter', fontSize:10, fontWeight:700, letterSpacing:'0.12em',
            textShadow:`0 0 6px ${ring}88`,
          }}>{hit}</div>
        )}
      </div>
      <div style={{ textAlign:'right' }}>
        <div style={{
          fontFamily:'JetBrains Mono', fontSize:38, fontWeight:800, color:'#fff',
          letterSpacing:'-0.02em', lineHeight:1,
        }}>{combo}</div>
        <div style={{ marginTop:4, display:'flex', gap:8, justifyContent:'flex-end',
          fontFamily:'JetBrains Mono', fontSize:10, color: C.textTer }}>
          <span>F:{f}</span><span>B:{b}</span><span>S:{s}</span>
        </div>
      </div>
    </div>
  );
}

// vivid date scope chip with emoji glyph
function DateChip({ icon, label, sub, active, color=C.gold }) {
  return (
    <div style={{
      display:'inline-flex', alignItems:'center', gap:6,
      padding:'8px 12px', borderRadius:999,
      background: active ? `linear-gradient(180deg, ${color}33, ${color}10)` : 'rgba(255,255,255,0.04)',
      border:`1.4px solid ${active ? color : 'rgba(255,255,255,0.12)'}`,
      boxShadow: active ? `0 0 12px ${color}66` : 'none',
      whiteSpace:'nowrap',
    }}>
      <span style={{ fontSize:13 }}>{icon}</span>
      <span style={{ fontFamily:'Inter', fontSize:13, fontWeight:700, color: active ? '#fff' : C.textSec }}>{label}</span>
      {sub && <span style={{ fontFamily:'Inter', fontSize:11, color: C.textTer, marginLeft:2 }}>{sub}</span>}
    </div>
  );
}

// generate button — gradient pill with icon
function GenerateBtn({ label='Generate', icon='⟳' }) {
  return (
    <div style={{
      display:'inline-flex', alignItems:'center', gap:6,
      padding:'7px 14px', borderRadius:999,
      background:`linear-gradient(135deg, ${C.purple}, ${C.purple2})`,
      boxShadow:`0 0 14px ${C.purple}88, 0 4px 16px rgba(0,0,0,0.3)`,
      fontFamily:'Inter', fontSize:13, fontWeight:700, color:'#fff',
    }}>
      <span style={{ fontSize:13 }}>{icon}</span>{label}
    </div>
  );
}

// circular gauge with gradient stroke + glow
function NeonRing({ value=0.94, size=140, stroke=10, color=C.cyan, color2=C.cyan2,
                  innerLabel, innerSub, glowAmt=20 }) {
  const r = (size - stroke) / 2;
  const Cc = 2*Math.PI*r;
  const v = Math.max(0, Math.min(1, value));
  const id = useMemo(()=>'g'+Math.random().toString(36).slice(2,8),[]);
  return (
    <svg width={size} height={size} style={{ filter:`drop-shadow(0 0 ${glowAmt}px ${color}aa)` }}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={color}/>
          <stop offset="100%" stopColor={color2}/>
        </linearGradient>
      </defs>
      <circle cx={size/2} cy={size/2} r={r} stroke="rgba(255,255,255,0.06)" strokeWidth={stroke} fill="none"/>
      <circle cx={size/2} cy={size/2} r={r} stroke={`url(#${id})`} strokeWidth={stroke}
        fill="none" strokeLinecap="round"
        strokeDasharray={`${Cc*v} ${Cc}`}
        transform={`rotate(-90 ${size/2} ${size/2})`}/>
      {innerLabel != null && (
        <text x={size/2} y={size/2 - (innerSub?6:-3)} textAnchor="middle" dominantBaseline="middle"
          fill="#fff" fontFamily="Inter" fontWeight={800}
          fontSize={size*0.26} style={{ filter:`drop-shadow(0 0 6px ${color}88)` }}>{innerLabel}</text>
      )}
      {innerSub && (
        <text x={size/2} y={size/2+18} textAnchor="middle" dominantBaseline="middle"
          fill="rgba(255,255,255,0.7)" fontFamily="Inter" fontWeight={700}
          fontSize={11} letterSpacing="0.16em">{innerSub}</text>
      )}
    </svg>
  );
}

// signal bar gradient
function NeonBar({ label, icon, value, color=C.cyan, color2=C.cyan2 }) {
  const v = Math.max(0, Math.min(1, value));
  return (
    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
      <span style={{ fontSize:14, color, filter:`drop-shadow(0 0 6px ${color}aa)` }}>{icon}</span>
      <span style={{ fontFamily:'Inter', fontSize:13, fontWeight:600, color:'#fff', flex:1 }}>{label}</span>
      <div style={{ width:90, height:5, borderRadius:3, background:'rgba(255,255,255,0.06)', overflow:'hidden' }}>
        <div style={{ width:`${v*100}%`, height:'100%',
          background:`linear-gradient(90deg, ${color2}, ${color})`,
          boxShadow:`0 0 8px ${color}aa`,
        }}/>
      </div>
      <span style={{ fontFamily:'Inter', fontSize:13, fontWeight:700, color:'#fff', width:42, textAlign:'right' }}>
        {Math.round(v*100)}%
      </span>
    </div>
  );
}

// bottom tab — icon + label, gold for active
function BottomTabNeon({ active='slates' }) {
  const tabs = [
    { k:'home',    label:'Home',    g:'⌂' },
    { k:'slates',  label:'Slates',  g:'⚡' },
    { k:'zk30',    label:'ZK30',    g:'◎' },
    { k:'results', label:'Results', g:'◧' },
    { k:'numbers', label:'Numb…',   g:'#' },
    { k:'learn',   label:'Learn',   g:'✎' },
    { k:'profile', label:'Profile', g:'☺' },
  ];
  return (
    <div style={{
      borderTop:`1px solid ${C.borderSoft}`, padding:'8px 0 22px',
      display:'flex', justifyContent:'space-around', background:'rgba(10,6,19,0.92)',
      backdropFilter:'blur(8px)',
    }}>
      {tabs.map(t => {
        const on = t.k===active;
        return (
          <div key={t.k} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:3 }}>
            <span style={{ fontSize:18, color: on?C.gold:C.textTer,
              filter: on?`drop-shadow(0 0 6px ${C.gold}cc)`:'none' }}>{t.g}</span>
            <span style={{ fontFamily:'Inter', fontSize:9, fontWeight:600,
              color: on?'#fff':C.textTer, letterSpacing:'0.02em' }}>{t.label}</span>
          </div>
        );
      })}
    </div>
  );
}

// page wrapper
function Page({ children, padTop=54, padBottom=84 }) {
  return (
    <div className="scrollhide" style={{
      width:'100%', height:'100%', overflow:'auto',
      background:`radial-gradient(ellipse at top, #1c0d36 0%, ${C.bg0} 55%)`,
      color:'#fff', display:'flex', flexDirection:'column',
      paddingTop:padTop, paddingBottom:padBottom,
    }}>{children}</div>
  );
}

// header (logo + bolt + title + generate btn)
function NeonHeader({ title='K6 Slates', sub='Live slate · Unlimited regenerations', icon='⚡', glowColor=C.gold }) {
  return (
    <div style={{ padding:'12px 16px 6px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
      <div>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:26, color:glowColor, filter:`drop-shadow(0 0 10px ${glowColor}cc)` }}>{icon}</span>
          <div style={{ fontFamily:'Inter', fontSize:24, fontWeight:800, letterSpacing:'-0.01em' }} className="gtext-purple">{title}</div>
        </div>
        <div style={{ fontFamily:'Inter', fontSize:11, color:C.textTer, marginTop:2 }}>
          <span className="gtext-purple">✦</span> {sub}
        </div>
      </div>
      <GenerateBtn/>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────
// SCREEN A — slate list (matches reference top-left)
// ─────────────────────────────────────────────────────────────────────
function ScreenSlates() {
  return (
    <Page>
      <NeonHeader/>

      {/* date chip rail */}
      <div className="scrollhide" style={{
        display:'flex', gap:6, padding:'10px 14px', overflowX:'auto',
      }}>
        <DateChip icon="✦" label="Yesterday" color={C.purple}/>
        <DateChip icon="🌙" label="May 4" active color={C.purple}/>
        <DateChip icon="✦" label="May 3" color={C.purple}/>
        <DateChip icon="📅" label="May 1" color={C.purple}/>
      </div>

      {/* heat check pill */}
      <div style={{ padding:'4px 14px 12px' }}>
        <div style={{
          padding:'10px 14px', borderRadius:999,
          background:'rgba(255,255,255,0.03)',
          border:`1px solid ${C.borderSoft}`,
          display:'flex', alignItems:'center', gap:8, justifyContent:'center',
          color:C.textSec, fontFamily:'Inter', fontSize:13, fontWeight:600,
        }}>
          <span style={{ fontSize:13 }}>🔍</span> Heat Check Any Combo
        </div>
      </div>

      {/* stat tiles */}
      <div style={{ padding:'2px 14px 14px', display:'flex', gap:8 }}>
        <StatTile value="2"  label="Morn"     color={C.amber}/>
        <StatTile value="31" label="Midday"   color={C.purple}/>
        <StatTile value="34" label="Evening"  color={C.purple}/>
        <StatTile value="7"  label="Night"    color={C.purple}/>
        <StatTile value="74" label="ZK6 Hits" color={C.cyan}/>
      </div>

      {/* slate cards */}
      <div style={{ padding:'2px 14px', display:'flex', flexDirection:'column', gap:14 }}>
        <SlateRow avatar="TN" avatarColor={C.cyan} label="TN · Cash 3"
          mode="Morning" hit="ZK6 HIT" combo="072" f="07" b="72" s="02"/>
        <SlateRow avatar="TX" avatarColor={C.amber} label="TX · Pick 3"
          mode="Morning" combo="116" f="11" b="16" s="16"/>
        <SlateRow avatar="KY" avatarColor={C.cyan} label="KY · Pick 3"
          mode="Midday" hit="ZK6 HIT" combo="270" f="27" b="70" s="20"/>
      </div>

      {/* perf footer */}
      <div style={{ padding:'14px 14px 4px' }}>
        <div style={{
          padding:'12px 14px', borderRadius:8,
          background:'rgba(255,255,255,0.02)', border:`1px solid ${C.borderSoft}`,
          fontFamily:'Inter', fontSize:13, fontWeight:700, color:C.textSec,
        }}>ZK6 PERFORMANCE — Yesterday</div>
      </div>

      <div style={{ flex:1 }}/>
      <BottomTabNeon active="slates"/>
    </Page>
  );
}

// ─────────────────────────────────────────────────────────────────────
// SCREEN B — pick detail (top-right)
// ─────────────────────────────────────────────────────────────────────
function ScreenPickDetail() {
  return (
    <Page>
      <NeonHeader/>

      {/* PICK #1 card */}
      <div style={{ padding:'4px 14px 0' }}>
        <div style={{
          borderRadius:14, padding:'14px',
          background:'linear-gradient(180deg, rgba(30,18,55,0.85), rgba(15,8,32,0.92))',
          border:`1px solid ${C.purple}55`,
          boxShadow:`0 0 18px ${C.purple}33`,
        }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>
            <span style={{ fontSize:18, color:C.gold, filter:`drop-shadow(0 0 6px ${C.gold}cc)` }}>🏅</span>
            <span style={{ fontFamily:'Inter', fontSize:18, fontWeight:800, color:'#fff' }}>PICK #1</span>
            <div style={{ flex:1 }}/>
            <div style={{ width:24, height:24, borderRadius:'50%', background:'rgba(255,255,255,0.06)',
              display:'flex', alignItems:'center', justifyContent:'center', color:C.textSec, fontSize:12 }}>×</div>
          </div>

          {/* match ring + digits */}
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <NeonRing value={0.94} size={130} stroke={9} color={C.cyan} color2={C.cyan2}
              innerLabel="94%" innerSub="MATCH"/>
            <div style={{ flex:1, paddingLeft:6 }}>
              <div style={{ fontFamily:'Inter', fontSize:10, fontWeight:700, color:C.cyan, letterSpacing:'0.14em', textShadow:`0 0 6px ${C.cyan}88` }}>ZK6 INTELLIGENCE MATCH</div>
              <div style={{ display:'flex', alignItems:'baseline', gap:6, marginTop:8 }}>
                <span style={{ fontFamily:'JetBrains Mono', fontSize:46, fontWeight:800, color:'#fff', textShadow:`0 0 12px ${C.amber}aa` }}>8</span>
                <span style={{ fontFamily:'JetBrains Mono', fontSize:30, color:C.amber, fontWeight:800 }}>—</span>
              </div>
              <div style={{ display:'flex', alignItems:'baseline', gap:6 }}>
                <span style={{ fontFamily:'JetBrains Mono', fontSize:46, fontWeight:800, color:'#fff', textShadow:`0 0 12px ${C.amber}aa` }}>2</span>
                <span style={{ fontFamily:'JetBrains Mono', fontSize:30, color:C.amber, fontWeight:800 }}>—</span>
              </div>
            </div>
          </div>

          {/* position chips */}
          <div style={{ display:'flex', gap:8, marginTop:14 }}>
            {[{n:'7',l:'Pos 1',c:C.amber},{n:'0',l:'Pos 2',c:C.cyan},{n:'2',l:'Pos 3',c:C.amber}].map((p,i) => (
              <div key={i} style={{ flex:1, padding:'8px', borderRadius:10,
                background:'rgba(255,255,255,0.03)', border:`1px solid ${p.c}66`,
                boxShadow:`0 0 10px ${p.c}33`,
                display:'flex', flexDirection:'column', alignItems:'center', gap:2 }}>
                <span style={{ fontFamily:'JetBrains Mono', fontSize:24, fontWeight:800, color:p.c, textShadow:`0 0 8px ${p.c}aa` }}>{p.n}</span>
                <span style={{ fontFamily:'Inter', fontSize:10, color:C.textSec }}>{p.l}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* signal breakdown */}
      <div style={{ padding:'12px 14px' }}>
        <div style={{
          borderRadius:12, padding:'12px 14px',
          background:'rgba(255,255,255,0.03)',
          border:`1px solid ${C.borderSoft}`,
          display:'flex', gap:14, alignItems:'center',
        }}>
          <div style={{ flex:1 }}>
            <div style={{ fontFamily:'Inter', fontSize:11, fontWeight:700, color:'#fff', letterSpacing:'0.14em', marginBottom:10 }}>SIGNAL BREAKDOWN</div>
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              <NeonBar label="Frequency"   icon="📈" value={1.00} color={C.cyan}   color2={C.cyan2}/>
              <NeonBar label="Momentum"    icon="⚙"  value={0.72} color={C.purple} color2={C.purple2}/>
              <NeonBar label="Pattern"     icon="◈"  value={0.30} color={C.cyan}   color2={C.cyan2}/>
              <NeonBar label="Consistency" icon="◐"  value={0.00} color={C.purple} color2={C.purple2}/>
            </div>
          </div>
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4 }}>
            <NeonRing value={1.0} size={86} stroke={6} color={C.amber} color2={C.amber2}
              innerLabel="100" innerSub=""/>
            <div style={{ fontFamily:'Inter', fontSize:11, fontWeight:800 }} className="gtext-amber">ON FIRE🔥</div>
          </div>
        </div>
      </div>

      {/* pair intelligence matrix */}
      <div style={{ padding:'0 14px 14px' }}>
        <div style={{
          borderRadius:12, padding:'12px 14px',
          background:'rgba(255,255,255,0.02)', border:`1px solid ${C.borderSoft}`,
        }}>
          <div style={{ fontFamily:'Inter', fontSize:11, fontWeight:700, letterSpacing:'0.14em' }}>PAIR INTELLIGENCE MATRIX</div>
          <div style={{ fontFamily:'Inter', fontSize:10, color:C.textTer, marginBottom:10 }}>Advanced Data Matrix Grid</div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:1, background:C.borderSoft, border:`1px solid ${C.borderSoft}`, borderRadius:6, overflow:'hidden' }}>
            {[
              ['PAIR','87','72','82'],
              ['Momentum','92%','0.7%','6.8%'],
              ['Pattern','30%','52%','52%'],
              ['Signal Sync','0.0%','0.0%','0.0%'],
              ['Historical','0%','0.0%','6.0%'],
              ['Drow0op','—','Engine\nSpec','Engine\nSync'],
            ].map((row,r) => row.map((cell,ci) => (
              <div key={`${r}-${ci}`} style={{
                background:r===0?'rgba(155,91,255,0.10)':'rgba(20,12,38,0.6)',
                padding:'6px 8px', fontFamily:'Inter', fontSize:10,
                color: r===0?'#fff':(ci===0?C.textSec:'#fff'),
                fontWeight: r===0?700:500,
                whiteSpace:'pre-line',
              }}>{cell}</div>
            )))}
          </div>
        </div>
      </div>

                ['rose',   C.rose,   'Momentum · Pburst'],
                ['amber',  C.amber,  'Hot streak'],
                ['gold',   C.gold,   'Consistency · DGC'],
                ['purple', C.purple, 'Pattern · CO · Brand'],
              ].map(([k, c, label]) => (
                <div key={k} style={{ borderRadius:10, padding:10,
                      border:`1px solid ${c}55`, boxShadow:`0 0 12px ${c}33`, background:'#0a0613' }}>
                  <div style={{ width:'100%', height:36, borderRadius:6, background:c,
                                boxShadow:`0 0 12px ${c}99` }}/>
                  <div style={{ fontFamily:'JetBrains Mono', fontSize:11, fontWeight:800, marginTop:8 }}>
                    --hm-{k}
                  </div>
                  <div style={{ fontFamily:'JetBrains Mono', fontSize:9, color:C.textTer, marginTop:2 }}>
                    {c}
                  </div>
                  <div style={{ fontSize:9, color:C.textSec, marginTop:6, lineHeight:1.3 }}>
                    {label}
                  </div>
                </div>
              ))}
            </div>

            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, marginTop:18 }}>
              <TokenBlock title="Type" rows={[
                ['--hm-font-sans',  'Inter'],
                ['--hm-font-mono',  'JetBrains Mono'],
                ['--hm-fs-eyebrow', '10px / 700 / .16em'],
                ['--hm-fs-h1',      '24px / 800'],
                ['--hm-fs-stat',    '32px mono'],
                ['--hm-fs-combo',   '38px mono'],
              ]}/>
              <TokenBlock title="Spacing & Radii" rows={[
                ['--hm-sp-2','8px'],['--hm-sp-3','12px'],['--hm-sp-4','16px'],
                ['--hm-r-pill','999px'],['--hm-r-card','16px'],['--hm-r-bar','2px'],
              ]}/>
              <TokenBlock title="SlateCard (spec)" rows={[
                ['paddingX',  '12px'],
                ['paddingY',  '8px'],
                ['gap',       '8px'],
                ['rankWidth', '32px'],
                ['rankPaddingRight', '8px'],
              ]}/>
              <TokenBlock title="SignalBar (spec)" rows={[
                ['height',       '4px'],
                ['gap',          '6px'],
                ['labelWidth',   '60px'],
                ['fillMaxWidth', '60px'],
                ['valueWidth',   '22px'],
                ['fontSize',     '9pt / 700'],
              ]}/>
            </div>

            <div style={{ marginTop:16, padding:10, borderRadius:8, background:'#0a0613',
                          border:`1px solid ${C.borderSoft}`,
                          fontFamily:'JetBrains Mono', fontSize:10, color:C.textSec, lineHeight:1.6 }}>
              <span className="gtext-cyan">{`/* drop in once at app root */`}</span><br/>
              <span style={{ color:C.text }}>{`<link rel="stylesheet" href="theme/hitmaster-theme.css">`}</span><br/>
              <span style={{ color:C.text }}>{`import theme, { temperatureColor, channelColor } from './theme/hitmaster-theme.js'`}</span>
            </div>
          </div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

// ── True-layout SlateCard ─ pixel-faithful to data spec ────────────
const SAMPLE_PICK = {
  rank: 1, combo: '742', comboSet: '{2,4,7}',
  temperature: 75, multiplicity: 'singles', topPair: '24',
  components: { BOX: 0.82, PBURST: 0.65, CO: 0.45, DGC: 0.91 },
};
const SAMPLE_LIST = [
  SAMPLE_PICK,
  { rank:2, combo:'318', comboSet:'{1,3,8}', temperature:88, multiplicity:'singles', topPair:'18',
    components:{ BOX:0.91, PBURST:0.78, CO:0.62, DGC:0.55 } },
  { rank:3, combo:'606', comboSet:'{0,6}',   temperature:52, multiplicity:'doubles', topPair:'06',
    components:{ BOX:0.44, PBURST:0.71, CO:0.38, DGC:0.82 } },

];

function tempTier(v) {
  if (v >= 80) return { color:'#ff3b30', label:'HOT'  };
  if (v >= 60) return { color:'#ffcc00', label:'WARM' };
  if (v >= 40) return { color:'#34c759', label:'MILD' };
  return        { color:'#666666', label:'COLD' };
}

function TempBadge({ value }) {
  const t = tempTier(value);
  return (
    <div style={{
      display:'inline-flex', alignItems:'center', gap:6,
      padding:'4px 10px', borderRadius:999,
      border:`1px solid ${t.color}`, color:t.color,
      boxShadow:`0 0 14px ${t.color}55`,
      fontFamily:'JetBrains Mono', fontWeight:800, fontSize:11, letterSpacing:'.06em',
    }}>
      <span>{t.label}</span>
      <span style={{ opacity:.85 }}>{value}°</span>
    </div>
  );
}

// SignalBar — exact data-spec metrics (label 60, track 4h, fill = value*60, value 22)
function SignalBarSpec({ channel, value, color }) {
  return (
    <div style={{ display:'flex', alignItems:'center', gap:6,
                  fontFamily:'JetBrains Mono', fontSize:9, fontWeight:700 }}>
      <div style={{ width:60, color:C.textTer, textTransform:'uppercase', letterSpacing:'0.08em' }}>
        {channel}
      </div>
      <div style={{ width:60, height:4, background:'#1E1E1E', borderRadius:2, overflow:'hidden' }}>
        <div style={{ width: value*60, height:'100%', background:color, borderRadius:2,
                      boxShadow:`0 0 6px ${color}aa` }}/>
      </div>
      <div style={{ width:22, color:C.text, textAlign:'right' }}>
        {Math.round(value*100)}
      </div>
    </div>
  );
}

function SlateCardTrue({ data }) {
  const t = tempTier(data.temperature);
  return (
    <div style={{
      width: 372,
      background: C.card,
      border:`1px solid ${C.borderSoft}`,
      borderRadius:16,
      padding:'8px 12px',          // ← spec: 8/12
      boxShadow:`0 0 18px ${t.color}33, inset 0 0 18px ${t.color}11`,
      display:'flex', flexDirection:'column', gap:8,   // ← spec: 8 gap
      color:C.text, fontFamily:'Inter',
    }}>
      {/* HEADER ── rank · confidence · energy ──────────────── */}
      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
        {/* rank container 32 wide, pr 8 */}
        <div style={{ width:32, paddingRight:8 }}>
          <div style={{ fontFamily:'JetBrains Mono', fontWeight:800, fontSize:14,
                        color:t.color, textShadow:`0 0 8px ${t.color}88` }}>
            #{data.rank}
          </div>
        </div>
        <div style={{ flex:1, display:'flex', flexDirection:'column' }}>
          <div style={{ fontSize:9, fontWeight:700, letterSpacing:'.16em',
                        color:C.textTer, textTransform:'uppercase' }}>
            Confidence
          </div>
          <div style={{ fontFamily:'JetBrains Mono', fontWeight:800, fontSize:13, color:C.text,
                        marginTop:2 }}>
            {Math.round((data.components.BOX + data.components.DGC) * 50)}%
          </div>
        </div>
        <TempBadge value={data.temperature}/>
      </div>

      {/* BODY ── 3-digit combo display ──────────────────────── */}
      <div style={{ display:'flex', alignItems:'baseline', gap:14, paddingLeft:32 }}>
        {data.combo.split('').map((d,i) => (
          <div key={i} style={{
            fontFamily:'JetBrains Mono', fontWeight:800, fontSize:44, lineHeight:1,
            color:C.text, letterSpacing:'-0.02em',
            textShadow:`0 0 14px ${t.color}aa`,
          }}>{d}</div>
        ))}
        <div style={{ marginLeft:'auto', display:'flex', flexDirection:'column',
                      alignItems:'flex-end', gap:2 }}>
          <div style={{ fontSize:9, fontWeight:700, letterSpacing:'.14em',
                        color:C.textTer, textTransform:'uppercase' }}>
            Box · {data.multiplicity}
          </div>
          <div style={{ fontFamily:'JetBrains Mono', fontSize:11, fontWeight:700,
                        color:C.textSec }}>
            {data.comboSet}
          </div>
          <div style={{ fontFamily:'JetBrains Mono', fontSize:9, fontWeight:700,
                        color:t.color, marginTop:2 }}>
            top pair · {data.topPair}
          </div>
        </div>
      </div>

      {/* FOOTER ── 4 SignalBars (BOX · PBURST · CO · DGC) ───── */}
      <div style={{ paddingLeft:32, display:'flex', flexDirection:'column', gap:6 }}>
        <SignalBarSpec channel="BOX"    value={data.components.BOX}    color={C.cyan}/>
        <SignalBarSpec channel="PBURST" value={data.components.PBURST} color={C.rose}/>
        <SignalBarSpec channel="CO"     value={data.components.CO}     color={C.purple}/>
        <SignalBarSpec channel="DGC"    value={data.components.DGC}    color={C.gold}/>
      </div>
    </div>
  );
}

function TokenBlock({ title, rows }) {
  return (
    <div style={{ borderRadius:10, padding:12, border:`1px solid ${C.borderSoft}`,
                  background:'#0a0613' }}>
      <div style={{ fontSize:9, fontWeight:700, letterSpacing:'.16em',
                    color:C.textTer, textTransform:'uppercase', marginBottom:8 }}>
        {title}
      </div>
      {rows.map(([k,v]) => (
        <div key={k} style={{ display:'flex', justifyContent:'space-between',
                              alignItems:'center', padding:'3px 0' }}>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:10, color:C.textSec }}>{k}</span>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:10, fontWeight:800,
                         color:C.text }}>{v}</span>
        </div>
      ))}
    </div>
  );
}
