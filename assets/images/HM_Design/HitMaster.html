<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>HitMaster — design canvas</title>
<meta name="viewport" content="width=1600"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#f0eee9; }
  body { font-family:'JetBrains Mono', ui-monospace, monospace; }
  @keyframes hmpulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: .35; transform: scale(0.85); }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<!-- starters -->
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="android-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<!-- app components + screens -->
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel">

const { useState, useEffect, useMemo } = React;

// ── theme presets ─────────────────────────────────────────────────────
const PALETTES = {
  spec: { freq:'#007AFF', mom:'#FF3B30', pat:'#5856D6', cons:'#FFCC00' },
  // muted version of the same wheel for a more refined data-terminal vibe
  muted: { freq:'#4A90E2', mom:'#E04A3E', pat:'#7A78D9', cons:'#E5B83C' },
  // mono — keep a single accent and rely on type/weight for hierarchy
  mono: { freq:'#FFFFFF', mom:'#FFCC00', pat:'#A0A0A0', cons:'#FFCC00' },
};

const FONTS = {
  jetbrains: "'JetBrains Mono', ui-monospace, monospace",
  plex:      "'IBM Plex Mono', ui-monospace, monospace",
  geist:     "'Geist Mono', ui-monospace, monospace",
  space:     "'Space Mono', ui-monospace, monospace",
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "spec",
  "font": "jetbrains",
  "density": "compact",
  "tabBar": "ios"
}/*EDITMODE-END*/;

function applyTheme(t) {
  const p = PALETTES[t.palette] || PALETTES.spec;
  window.HM = {
    ...window.HM,
    bg:'#0A0A0A', surface:'#121212', card:'#1A1A1A',
    track:'#1E1E1E', border:'#2A2A2A',
    text:'#FFFFFF', textSec:'#A0A0A0', textTer:'#666666',
    ...p,
    font: FONTS[t.font] || FONTS.jetbrains,
  };
}

// ── tweaks panel content ──────────────────────────────────────────────
function HMTweaks() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  applyTheme(t);
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection title="palette">
        <TweakRadio
          value={t.palette}
          onChange={v => setTweak('palette', v)}
          options={[
            { value:'spec',  label:'spec' },
            { value:'muted', label:'muted' },
            { value:'mono',  label:'mono' },
          ]}
        />
      </TweakSection>
      <TweakSection title="typeface">
        <TweakSelect
          value={t.font}
          onChange={v => setTweak('font', v)}
          options={[
            { value:'jetbrains', label:'JetBrains Mono' },
            { value:'plex',      label:'IBM Plex Mono' },
            { value:'geist',     label:'Geist Mono' },
            { value:'space',     label:'Space Mono' },
          ]}
        />
      </TweakSection>
      <TweakSection title="density">
        <TweakRadio
          value={t.density}
          onChange={v => setTweak('density', v)}
          options={[
            { value:'compact', label:'compact' },
            { value:'normal',  label:'normal' },
          ]}
        />
      </TweakSection>
      <TweakSection title="tab bar">
        <TweakRadio
          value={t.tabBar}
          onChange={v => setTweak('tabBar', v)}
          options={[
            { value:'ios',     label:'ios' },
            { value:'android', label:'android' },
          ]}
        />
      </TweakSection>
    </TweaksPanel>
  );
}

// ── canvas helpers ────────────────────────────────────────────────────
function PhoneIOS({ children, dark=true, width=360, height=720 }) {
  // Use IOSDevice frame; we render screens with our own status bar inset.
  return <IOSDevice dark={dark} width={width} height={height}>{children}</IOSDevice>;
}
function PhoneAndroid({ children, width=360, height=720 }) {
  return <AndroidDevice dark width={width} height={height}>{children}</AndroidDevice>;
}

// ── component closeups ────────────────────────────────────────────────
function CloseupCard({ children, label, w=300, h=300 }) {
  return (
    <div style={{
      width:w, height:h, background: window.HM.surface,
      border:`1px solid ${window.HM.border}`, borderRadius:10,
      padding:18, position:'relative', overflow:'hidden',
      display:'flex', flexDirection:'column',
    }}>
      <Mono size={10} weight={700} tracking="0.18em" transform="uppercase"
        color={window.HM.textTer} style={{ marginBottom:14 }}>{label}</Mono>
      <div style={{ flex:1, display:'flex', flexDirection:'column', justifyContent:'center' }}>
        {children}
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────
function App() {
  const [tweaksRev, setRev] = useState(0);
  // Re-render canvas when window.HM mutates (tweaks change)
  useEffect(() => {
    const handler = () => setRev(r => r+1);
    window.addEventListener('hm-theme-tick', handler);
    return () => window.removeEventListener('hm-theme-tick', handler);
  }, []);
  // Force a tick whenever tweaks panel rerenders
  useEffect(() => {
    const id = setInterval(() => window.dispatchEvent(new Event('hm-theme-tick')), 250);
    return () => clearInterval(id);
  }, []);

  // get current tweak values from persisted defaults; we read them via window
  const t = window.__hm_tweaks || TWEAK_DEFAULTS;
  applyTheme(t);

  const phoneW = 360, phoneH = 720;

  // helper to build screens with current tweak args
  const sk = (Comp, extra={}) => <Comp density={t.density} tabBar={t.tabBar} {...extra}/>;

  return (
    <>
      <HMTweaks/>
      <DesignCanvas>

        {/* SECTION: hero — top-of-funnel reveal */}
        <DCSection id="hero" title="HitMaster" subtitle="data-terminal aesthetic · monospaced · dark · 4 signal channels">
          <DCArtboard id="hero-ios" label="iOS · dashboard" width={phoneW+20} height={phoneH+20}>
            <PhoneIOS width={phoneW} height={phoneH}>{sk(DashboardScreen)}</PhoneIOS>
          </DCArtboard>
          <DCArtboard id="hero-android" label="Android · dashboard" width={phoneW+20} height={phoneH+20}>
            <PhoneAndroid width={phoneW} height={phoneH}>{sk(DashboardScreen, {tabBar:'android'})}</PhoneAndroid>
          </DCArtboard>
          <DCArtboard id="hero-builder-ios" label="iOS · explorer" width={phoneW+20} height={phoneH+20}>
            <PhoneIOS width={phoneW} height={phoneH}>{sk(BuilderScreen)}</PhoneIOS>
          </DCArtboard>
          <DCArtboard id="hero-modal-ios" label="iOS · pick detail" width={phoneW+20} height={phoneH+20}>
            <PhoneIOS width={phoneW} height={phoneH}>{sk(ResultsScreen, {modal:true})}</PhoneIOS>
          </DCArtboard>
        </DCSection>

        {/* SECTION: core flow */}
        <DCSection id="flow" title="core flow" subtitle="dashboard → explorer → results → detail">
          <DCArtboard id="flow-1" label="01 · dashboard" width={phoneW+20} height={phoneH+20}>
            <PhoneIOS width={phoneW} height={phoneH}>{sk(DashboardScreen)}</PhoneIOS>
          </DCArtboard>
          <DCArtboard id="flow-2" label="02 · explorer" width={phoneW+20} height={phoneH+20}>
            <PhoneIOS width={phoneW} height={phoneH}>{sk(BuilderScreen)}</PhoneIOS>
          </DCArtboard>
          <DCArtboard id="flow-3" label="03 · results" width={phoneW+20} height={phoneH+20}>
            <PhoneIOS width={phoneW} height={phoneH}>{sk(ResultsScreen)}</PhoneIOS>
          </DCArtboard>
          <DCArtboard id="flow-4" label="04 · pick detail" width={phoneW+20} height={phoneH+20}>
            <PhoneIOS width={phoneW} height={phoneH}>{sk(ResultsScreen, {modal:true})}</PhoneIOS>
          </DCArtboard>
        </DCSection>

        {/* SECTION: intel + account */}
        <DCSection id="intel" title="intelligence + account" subtitle="signal deep-dive, lifetime stats, settings">
          <DCArtboard id="intel-ios" label="iOS · intelligence" width={phoneW+20} height={phoneH+20}>
            <PhoneIOS width={phoneW} height={phoneH}>{sk(IntelligenceScreen)}</PhoneIOS>
          </DCArtboard>
          <DCArtboard id="intel-android" label="Android · intelligence" width={phoneW+20} height={phoneH+20}>
            <PhoneAndroid width={phoneW} height={phoneH}>{sk(IntelligenceScreen, {tabBar:'android'})}</PhoneAndroid>
          </DCArtboard>
          <DCArtboard id="acct-ios" label="iOS · account" width={phoneW+20} height={phoneH+20}>
            <PhoneIOS width={phoneW} height={phoneH}>{sk(AccountScreen)}</PhoneIOS>
          </DCArtboard>
          <DCArtboard id="acct-android" label="Android · account" width={phoneW+20} height={phoneH+20}>
            <PhoneAndroid width={phoneW} height={phoneH}>{sk(AccountScreen, {tabBar:'android'})}</PhoneAndroid>
          </DCArtboard>
        </DCSection>

        {/* SECTION: empty + onboarding */}
        <DCSection id="onboarding" title="empty states + onboarding" subtitle="first-run + zero-data postures">
          <DCArtboard id="empty-ios" label="iOS · empty" width={phoneW+20} height={phoneH+20}>
            <PhoneIOS width={phoneW} height={phoneH}>{sk(EmptyScreen)}</PhoneIOS>
          </DCArtboard>
          <DCArtboard id="empty-android" label="Android · empty" width={phoneW+20} height={phoneH+20}>
            <PhoneAndroid width={phoneW} height={phoneH}>{sk(EmptyScreen, {tabBar:'android'})}</PhoneAndroid>
          </DCArtboard>
          <DCArtboard id="onb-ios" label="iOS · learn / onboarding" width={phoneW+20} height={phoneH+20}>
            <PhoneIOS width={phoneW} height={phoneH}>{sk(OnboardingScreen)}</PhoneIOS>
          </DCArtboard>
          <DCArtboard id="onb-android" label="Android · learn / onboarding" width={phoneW+20} height={phoneH+20}>
            <PhoneAndroid width={phoneW} height={phoneH}>{sk(OnboardingScreen, {tabBar:'android'})}</PhoneAndroid>
          </DCArtboard>
        </DCSection>

        {/* SECTION: component closeups */}
        <DCSection id="components" title="components" subtitle="primitives in isolation">
          <DCArtboard id="cu-signalbar" label="SignalBar · 4 channels" width={340} height={260}>
            <CloseupCard label="signalbar" w={340} h={260}>
              <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                <SignalBar label="freq"   value={0.91} color={window.HM.freq}/>
                <SignalBar label="mom"    value={0.78} color={window.HM.mom}/>
                <SignalBar label="pat"    value={0.83} color={window.HM.pat}/>
                <SignalBar label="cons"   value={0.95} color={window.HM.cons}/>
                <div style={{ height:1, background:window.HM.border, margin:'4px 0' }}/>
                <SignalBar label="freq"   value={0.42} color={window.HM.freq} dense/>
                <SignalBar label="mom"    value={0.18} color={window.HM.mom}  dense/>
              </div>
            </CloseupCard>
          </DCArtboard>

          <DCArtboard id="cu-radial" label="RadialGauge · confidence" width={340} height={260}>
            <CloseupCard label="radial gauge" w={340} h={260}>
              <div style={{ display:'flex', justifyContent:'space-around', alignItems:'center' }}>
                <RadialGauge value={0.92} size={88} stroke={5} color={window.HM.freq} label="freq"/>
                <RadialGauge value={0.78} size={88} stroke={5} color={window.HM.mom}  label="mom"/>
                <RadialGauge value={0.95} size={88} stroke={5} color={window.HM.cons} label="cons"/>
              </div>
            </CloseupCard>
          </DCArtboard>

          <DCArtboard id="cu-spark" label="Sparkline · 14d" width={340} height={260}>
            <CloseupCard label="sparkline" w={340} h={260}>
              <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
                {[
                  { l:'freq', v:HM_SPARK_FREQ, c:window.HM.freq },
                  { l:'mom',  v:HM_SPARK_MOM,  c:window.HM.mom },
                  { l:'pat',  v:HM_SPARK_PAT,  c:window.HM.pat },
                ].map((r,i) => (
                  <div key={i} style={{ display:'flex', alignItems:'center', gap:12 }}>
                    <Mono size={10} weight={700} tracking="0.16em" transform="uppercase" color={r.c} style={{ width:46 }}>{r.l}</Mono>
                    <Sparkline values={r.v} color={r.c} width={200} height={28}/>
                    <Mono size={11} weight={700} color={window.HM.text}>{r.v[r.v.length-1].toFixed(2).slice(1)}</Mono>
                  </div>
                ))}
              </div>
            </CloseupCard>
          </DCArtboard>

          <DCArtboard id="cu-heatmap" label="HeatmapStrip · 56d" width={340} height={260}>
            <CloseupCard label="hit heatmap" w={340} h={260}>
              <HeatmapStrip days={HM_HEAT} cols={14} cell={18} gap={3} color={window.HM.cons}/>
              <div style={{ display:'flex', alignItems:'center', gap:6, marginTop:12 }}>
                <Mono size={9} color={window.HM.textTer}>cold</Mono>
                <div style={{ flex:1, height:4, background:`linear-gradient(90deg, ${window.HM.track}, ${window.HM.cons})`, borderRadius:2 }}/>
                <Mono size={9} color={window.HM.textTer}>hot</Mono>
              </div>
            </CloseupCard>
          </DCArtboard>

          <DCArtboard id="cu-slate" label="SlateCard · full" width={340} height={300}>
            <div style={{
              width:340, height:300, padding:20, background:window.HM.surface,
              border:`1px solid ${window.HM.border}`, borderRadius:10,
              display:'flex', alignItems:'center', justifyContent:'center',
            }}>
              <SlateCard rank={1} combo={847} confidence={0.92} energy={5} hit={true}
                signals={{box:0.91, pburst:0.78, co:0.83, dgc:0.95}} style={{ width:'100%' }}/>
            </div>
          </DCArtboard>

          <DCArtboard id="cu-statusribbon" label="StatusRibbon" width={340} height={260}>
            <div style={{
              width:340, height:260, padding:0, background:window.HM.surface,
              border:`1px solid ${window.HM.border}`, borderRadius:10, overflow:'hidden',
              display:'flex', flexDirection:'column',
            }}>
              <StatusRibbon engine="hm.engine v3.2" scope="MIDDAY" state="live"/>
              <StatusRibbon engine="hm.engine v3.2" scope="EVENING" state="archive"/>
              <StatusRibbon engine="hm.engine v3.2" scope="—" state="idle"/>
              <div style={{ flex:1, padding:'14px 16px' }}>
                <Mono size={10} color={window.HM.textTer}>live · archive · idle states. dot pulse on live, steady on archive, dim on idle.</Mono>
              </div>
            </div>
          </DCArtboard>

          <DCArtboard id="cu-typo" label="Typography" width={340} height={300}>
            <CloseupCard label="type scale" w={340} h={300}>
              <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                <div style={{ display:'flex', alignItems:'baseline', gap:10 }}>
                  <Mono size={9} color={window.HM.textTer} style={{ width:30 }}>9</Mono>
                  <Mono size={9} weight={700} tracking="0.18em" transform="uppercase" color={window.HM.textTer}>data · eyebrow</Mono>
                </div>
                <div style={{ display:'flex', alignItems:'baseline', gap:10 }}>
                  <Mono size={9} color={window.HM.textTer} style={{ width:30 }}>11</Mono>
                  <Mono size={11} weight={600}>caption / data value</Mono>
                </div>
                <div style={{ display:'flex', alignItems:'baseline', gap:10 }}>
                  <Mono size={9} color={window.HM.textTer} style={{ width:30 }}>13</Mono>
                  <Mono size={13} weight={500}>body — readable copy.</Mono>
                </div>
                <div style={{ display:'flex', alignItems:'baseline', gap:10 }}>
                  <Mono size={9} color={window.HM.textTer} style={{ width:30 }}>18</Mono>
                  <Mono size={18} weight={700} tracking="-0.01em">subhead</Mono>
                </div>
                <div style={{ display:'flex', alignItems:'baseline', gap:10 }}>
                  <Mono size={9} color={window.HM.textTer} style={{ width:30 }}>24</Mono>
                  <Mono size={24} weight={700} tracking="-0.02em">screen title</Mono>
                </div>
                <div style={{ display:'flex', alignItems:'baseline', gap:10 }}>
                  <Mono size={9} color={window.HM.textTer} style={{ width:30 }}>72</Mono>
                  <Mono size={72} weight={700} tracking="-0.05em" style={{ lineHeight:0.85 }}>847</Mono>
                </div>
              </div>
            </CloseupCard>
          </DCArtboard>

          <DCArtboard id="cu-palette" label="Palette" width={340} height={260}>
            <CloseupCard label="signal channels" w={340} h={260}>
              <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                {[
                  { l:'frequency',   c:window.HM.freq, h:window.HM.freq },
                  { l:'momentum',    c:window.HM.mom,  h:window.HM.mom },
                  { l:'pattern',     c:window.HM.pat,  h:window.HM.pat },
                  { l:'consistency', c:window.HM.cons, h:window.HM.cons },
                ].map((r,i) => (
                  <div key={i} style={{ display:'flex', alignItems:'center', gap:10 }}>
                    <div style={{ width:36, height:36, borderRadius:4, background:r.c }}/>
                    <div style={{ display:'flex', flexDirection:'column', gap:2 }}>
                      <Mono size={11} weight={700}>{r.l}</Mono>
                      <Mono size={9} color={window.HM.textTer}>{r.h.toUpperCase()}</Mono>
                    </div>
                  </div>
                ))}
              </div>
            </CloseupCard>
          </DCArtboard>
        </DCSection>

      </DesignCanvas>
    </>
  );
}

// keep window.__hm_tweaks fresh from useTweaks
const _origUseTweaks = window.useTweaks;
window.useTweaks = function patchedUseTweaks(defaults) {
  const [t, setT] = _origUseTweaks(defaults);
  window.__hm_tweaks = t;
  return [t, setT];
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
